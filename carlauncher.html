<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carlauncher · iDrive 8</title>
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: dark;
    font: 16px/1.35 "Segoe UI", sans-serif;
    --base: #080b0e;
    --panel: #101a26;
    --menu: #172330;
    --rail: #04080c;
    --line: #314355;
    --ink: #f0f5fa;
    --muted: #afc0cf;
    --blue: #80cdff;
    --selected: #205577;
    --map: #142631;
    --land: #223c38;
    --water: #1b3b52;
    --street: #37515c;
    --route: #55baff;
  }
  :root[data-theme="day"] {
    color-scheme: light;
    --base: #dce5ed;
    --panel: #f4f8fc;
    --menu: #f5f9fd;
    --line: #a9bac9;
    --ink: #172b3e;
    --muted: #475e71;
    --blue: #005d91;
    --selected: #cfe5f5;
    --map: #e2e9df;
    --land: #cbdcbe;
    --water: #bcddef;
    --street: #aab5b3;
    --route: #0877c4;
  }
  body { margin: 0; background: var(--base); color: var(--ink); }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #55baff; outline-offset: 3px; }
  .icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; flex: none; }
  .deck { display: grid; grid-template-columns: 76px minmax(0, 1.12fr) minmax(0, 1fr); gap: 6px; padding: 6px; min-height: 510px; height: 100dvh; }
  .rail { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 12px 8px; border-radius: 10px; background: var(--rail); color: #edf6ff; }
  .rail button { display: grid; place-items: center; width: 50px; height: 50px; border: 1px solid transparent; border-radius: 11px; background: #162636; }
  .rail button:hover { background: #24445e; }
  .rail button[aria-current="true"] { border-color: #d9edff; background: #163c57; }
  .rail .gear { width: 53px; height: 53px; border-radius: 50%; background: linear-gradient(140deg, #266e9b, #153e5c); }
  .divider { width: 100%; height: 1px; background: #516170; }
  .favorites { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; padding: 4px; }
  .favorites .icon { width: 25px; height: 25px; }
  .wifi { color: #48d48d; }
  .connection { margin-top: auto; display: grid; place-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid #516170; width: 100%; }
  .connection .icon { width: 21px; height: 21px; }
  .map, .view { position: relative; min-width: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .map { background: var(--map); min-height: 270px; }
  .map-drawing { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map-heading, .route-info { position: absolute; left: 16px; padding: 12px 16px; background: var(--panel); border-radius: 8px; }
  .map-heading { top: 16px; display: flex; align-items: center; gap: 10px; }
  .route-info { bottom: 16px; max-width: calc(100% - 32px); }
  .route-info strong { display: block; font-size: 23px; font-weight: 600; }
  .muted { color: var(--muted); }
  .right { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 6px; min-width: 0; }
  .view { display: flex; flex-direction: column; }
  .view-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 66px; padding: 8px 20px; border-bottom: 1px solid var(--line); }
  .view-top h1 { margin: 0; font-size: 25px; font-weight: 600; }
  .view-top span { color: var(--muted); font-size: 13px; text-align: right; }
  .icon-button { width: 46px; height: 46px; background: transparent; border: 1px solid var(--line); border-radius: 8px; display: grid; place-items: center; }
  .icon-button:hover { background: var(--selected); }
  .app-content { display: grid; align-content: center; justify-items: start; gap: 12px; flex: 1; padding: clamp(22px, 5vw, 68px); }
  .app-content .app-icon { width: 58px; height: 58px; color: var(--blue); margin-bottom: 6px; }
  .app-content h2 { margin: 0; font-size: clamp(26px, 4vw, 49px); font-weight: 600; letter-spacing: -.025em; line-height: 1.12; }
  .app-content p { margin: 0; max-width: 35ch; }
  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 0; min-height: 66px; padding: 10px 6px; border-radius: 8px; background: var(--rail); color: #f0f5fa; font-variant-numeric: tabular-nums; }
  .metric { flex: 1 1 auto; min-width: 82px; padding: 0 11px; }
  .metric + .metric { border-left: 1px solid #314355; }
  .metric small { color: #a9bfd1; display: block; font-size: 12px; }
  .metric strong { font-size: clamp(16px, 1.5vw, 25px); font-weight: 600; white-space: nowrap; }
  .battery strong { color: #a2e2b3; }
  .deck.expanded { grid-template-columns: 76px minmax(0, 1fr); }
  .expanded .map { display: none; }
  .popover { position: fixed; z-index: 2; top: 18px; left: 82px; width: min(320px, calc(100vw - 98px)); max-height: calc(100dvh - 32px); overflow: auto; padding: 8px; border: 1px solid var(--line); border-radius: 11px; background: var(--menu); box-shadow: 0 12px 30px #0005; }
  .popover h2 { padding: 10px 12px; margin: 0; font-size: 18px; }
  .popover button { display: flex; width: 100%; min-height: 52px; gap: 12px; align-items: center; text-align: left; border: 0; border-radius: 7px; padding: 10px 12px; background: transparent; }
  .popover button:hover { background: var(--selected); }
  .popover button span { flex: 1; }
  .popover button small { display: block; color: var(--muted); margin-top: 2px; }
  .popover button[aria-pressed="true"] .add-mark { display: none; }
  .popover button[aria-pressed="false"] .check-mark { display: none; }
  @media (max-width: 820px) {
    .deck { height: auto; min-height: 100dvh; grid-template-columns: 68px minmax(0, 1fr); }
    .rail { grid-row: 1 / 3; }
    .right { min-height: 320px; }
    .deck.expanded { grid-template-columns: 68px minmax(0, 1fr); }
    .popover { left: 74px; width: min(320px, calc(100vw - 82px)); }
    .view-top { padding-inline: 12px; }
    .view-top h1 { font-size: 21px; }
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" hidden>
  <symbol id="gear" viewBox="0 0 24 24"><path d="M10 3h4l.7 2.5 2 .9 2.3-1 2 3.5-1.9 1.7v2.5l1.9 1.7-2 3.5-2.3-1-2 .9L14 21h-4l-.7-2.5-2-.9-2.3 1-2-3.5 1.9-1.7v-2.5L3 9l2-3.5 2.3 1 2-.9Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="radio" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="m4 7 13-4m-3 8h4m-4 4h4"/><circle cx="8.5" cy="13.5" r="2.5"/></symbol>
  <symbol id="car" viewBox="0 0 24 24"><path d="m5 12 2-5h10l2 5M3 17v-3l2-2h14l2 2v3Zm2 0v2m14-2v2M6 14.5h1m10 0h1"/></symbol>
  <symbol id="store" viewBox="0 0 24 24"><path d="M5 8h14l1 12H4ZM9 8V6a3 3 0 0 1 6 0v2"/></symbol>
  <symbol id="wifi" viewBox="0 0 24 24"><path d="M3 9a15 15 0 0 1 18 0M6 13a10 10 0 0 1 12 0m-9 4a5 5 0 0 1 6 0m-3 3h.01"/></symbol>
  <symbol id="signal" viewBox="0 0 24 24"><path d="M5 19v-4m4 4v-7m4 7V9m4 10V6m4 13V3"/></symbol>
  <symbol id="expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
  <symbol id="split" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19m0-14-1.5 1.5m-11 11L5 19"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="m5 14 7-11 7 11-7-3Z"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="m12 5-7 7 7 7m-7-7h14"/></symbol>
</svg>

<main class="deck" id="deck" aria-label="Maqueta del carlauncher">
  <nav class="rail" aria-label="Accesos del carlauncher">
    <button class="gear" id="gear-button" aria-label="Menú del launcher" aria-controls="launcher-menu" aria-expanded="false">
      <svg class="icon" aria-hidden="true"><use href="#gear"/></svg>
    </button>
    <div class="divider"></div>
    <div class="favorites" id="favorites"></div>
    <div class="connection" aria-label="Indicadores de conexión de ejemplo">
      <svg class="icon wifi" aria-hidden="true"><use href="#wifi"/></svg>
      <svg class="icon" aria-hidden="true"><use href="#signal"/></svg>
    </div>
  </nav>

  <section class="map" aria-label="Vista de ruta de ejemplo">
    <svg class="map-drawing" viewBox="0 0 740 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Esquema ilustrativo de una ruta con una parada de carga">
      <path fill="var(--land)" d="M0 0h288l-26 87-111 61L0 125Zm519 0h221v221l-83-18-79-95ZM0 420l155-59 76 46 36 153H0Zm549 5 191-56v191H519Z"/>
      <path fill="none" stroke="var(--water)" stroke-width="34" d="M677-20c-99 164 23 226-18 327S515 444 471 580"/>
      <g fill="none" stroke="var(--street)" stroke-width="3">
        <path d="M0 175 135 165l106-40 102 24 150-72 247 20M0 228l137 7 143-58 132 33 163-58 165 16M0 287l144 15 130-59 113 26 169-38 184 31M0 351l178 12 72-39 136 24 158-56 196 46M0 460l192-27 117-46 121 17 147-35 163 26M0 520l203-26 112-57 134 25 111-32 180 15"/>
        <path d="m69 0 50 126 7 132 22 114-8 188M165 0l55 124-15 133 52 154 21 149M306 0l-9 114 28 122-9 136 58 188M419 0l-28 126 32 105-1 126 29 203M529 0l-31 137 35 133-33 143 33 147M616 0l-22 96 38 127-19 167 27 170"/>
      </g>
      <path fill="none" stroke="var(--panel)" stroke-width="16" stroke-linejoin="round" d="m248 414 77-72-4-84 83-43 83 5 70-58 23-71"/>
      <path fill="none" stroke="var(--route)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="m248 414 77-72-4-84 83-43 83 5 70-58 23-71"/>
      <circle cx="248" cy="414" r="13" fill="var(--route)" stroke="white" stroke-width="4"/>
      <circle cx="404" cy="215" r="16" fill="var(--panel)" stroke="var(--route)" stroke-width="4"/>
      <path d="m407 204-8 12h6l-2 9 8-12h-6Z" fill="var(--blue)"/>
      <circle cx="580" cy="91" r="11" fill="var(--panel)" stroke="var(--route)" stroke-width="4"/>
      <g fill="var(--ink)" font-family="Segoe UI, sans-serif" font-size="16">
        <text x="180" y="392">Madrid</text><text x="424" y="199">Parada de carga</text><text x="594" y="80">Destino</text>
      </g>
    </svg>
    <div class="map-heading"><svg class="icon" aria-hidden="true"><use href="#arrow"/></svg> Ruta de ejemplo</div>
    <div class="route-info"><strong>Madrid → Denia</strong><span class="muted">4 h 10 min · 452 km</span></div>
  </section>

  <section class="right" aria-label="Área de aplicación y estado del vehículo">
    <div class="view">
      <header class="view-top">
        <h1 id="app-title">DriveHub</h1>
        <span id="app-kind">Vista de ejemplo</span>
        <button class="icon-button" id="view-size" aria-label="Pantalla completa" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#expand"/></svg>
        </button>
      </header>
      <div class="app-content" aria-live="polite">
        <svg class="icon app-icon" aria-hidden="true"><use id="app-icon" href="#radio"/></svg>
        <h2 id="app-headline">Radio</h2>
        <p class="muted" id="app-description">Así quedaría la radio de DriveHub dentro del launcher si integramos esa función.</p>
      </div>
    </div>
    <footer class="status" aria-label="Lecturas simuladas">
      <div class="metric battery"><small>Batería</small><strong>64 %</strong></div>
      <div class="metric"><small>Autonomía</small><strong>248 km</strong></div>
      <div class="metric"><small>Temp. HV</small><strong>24 °C</strong></div>
      <div class="metric"><small>Parada de carga</small><strong>38 km</strong></div>
      <div class="metric"><small>Al llegar</small><strong>19 %</strong></div>
    </footer>
  </section>
</main>

<section class="popover" id="launcher-menu" aria-label="Menú del launcher" hidden>
  <div id="menu-actions">
    <h2>Launcher</h2>
    <button id="open-apps"><svg class="icon" aria-hidden="true"><use href="#plus"/></svg><span>Añadir aplicaciones</span></button>
    <button id="menu-size"><svg class="icon" aria-hidden="true"><use href="#expand"/></svg><span>Pantalla completa</span></button>
    <button id="theme"><svg class="icon" aria-hidden="true"><use href="#sun"/></svg><span>Tema diurno</span></button>
  </div>
  <div id="menu-apps" hidden>
    <button id="menu-back"><svg class="icon" aria-hidden="true"><use href="#back"/></svg><span>Volver al menú</span></button>
    <h2>Accesos de ejemplo</h2>
    <div id="app-options"></div>
  </div>
</section>

<script>
  const apps = {
    drivehub: {
      name: 'DriveHub', icon: 'radio', kind: 'Panel integrado · ejemplo', title: 'Radio',
      description: 'Así quedaría la radio de DriveHub dentro del launcher si integramos esa función.'
    },
    vehicle: {
      name: 'Vehículo', icon: 'car', kind: 'Panel propio · ejemplo', title: 'Estado del vehículo',
      description: 'Consulta de batería y autonomía. Los datos de esta maqueta son ficticios.'
    },
    store: {
      name: 'MGU Store', icon: 'store', kind: 'App independiente · ejemplo', title: 'Abrir MGU Store',
      description: 'Este acceso representa un cambio de aplicación. En la maqueta, la Store se queda en esta ficha.'
    }
  };

  const get = (id) => document.getElementById(id);
  const icon = (name, className = '') => `<svg class="icon ${className}" aria-hidden="true"><use href="#${name}"/></svg>`;
  const favorites = get('favorites');
  const menu = get('launcher-menu');
  const gear = get('gear-button');
  const shortcuts = new Set(['drivehub', 'vehicle']);
  let active = 'drivehub';

  function selectApp(id) {
    active = id;
    const app = apps[id];
    get('app-title').textContent = app.name;
    get('app-kind').textContent = app.kind;
    get('app-headline').textContent = app.title;
    get('app-description').textContent = app.description;
    get('app-icon').setAttribute('href', '#' + app.icon);
    for (const button of favorites.children) {
      button.setAttribute('aria-current', String(button.dataset.app === id));
    }
  }

  function renderFavorites() {
    favorites.replaceChildren();
    for (const id of shortcuts) {
      const app = apps[id];
      const button = document.createElement('button');
      button.dataset.app = id;
      button.setAttribute('aria-label', app.name);
      button.innerHTML = icon(app.icon);
      button.addEventListener('click', () => selectApp(id));
      favorites.append(button);
    }
    selectApp(active);
  }

  function setMenu(open, restoreFocus = false) {
    menu.hidden = !open;
    gear.setAttribute('aria-expanded', String(open));
    get('menu-actions').hidden = false;
    get('menu-apps').hidden = true;
    if (open) get('open-apps').focus();
    if (restoreFocus) gear.focus();
  }

  function toggleExpanded() {
    const expanded = get('deck').classList.toggle('expanded');
    const label = expanded ? 'Volver a pantalla dividida' : 'Pantalla completa';
    const glyph = expanded ? '#split' : '#expand';
    get('view-size').setAttribute('aria-label', label);
    get('view-size').setAttribute('aria-pressed', String(expanded));
    get('view-size').querySelector('use').setAttribute('href', glyph);
    get('menu-size').querySelector('use').setAttribute('href', glyph);
    get('menu-size').querySelector('span').textContent = label;
  }

  for (const [id, app] of Object.entries(apps)) {
    const button = document.createElement('button');
    button.innerHTML = icon(app.icon) + `<span>${app.name}<small>${app.kind}</small></span>`
      + icon('plus', 'add-mark') + icon('check', 'check-mark');
    button.setAttribute('aria-pressed', String(shortcuts.has(id)));
    button.addEventListener('click', () => {
      if (shortcuts.has(id)) {
        shortcuts.delete(id);
        if (active === id && shortcuts.size > 0) active = shortcuts.values().next().value;
      } else {
        shortcuts.add(id);
      }
      button.setAttribute('aria-pressed', String(shortcuts.has(id)));
      renderFavorites();
    });
    get('app-options').append(button);
  }

  gear.addEventListener('click', () => setMenu(menu.hidden, !menu.hidden));
  get('open-apps').addEventListener('click', () => {
    get('menu-actions').hidden = true;
    get('menu-apps').hidden = false;
    get('menu-back').focus();
  });
  get('menu-back').addEventListener('click', () => setMenu(true));
  get('view-size').addEventListener('click', toggleExpanded);
  get('menu-size').addEventListener('click', () => {
    toggleExpanded();
    setMenu(false, true);
  });
  get('theme').addEventListener('click', () => {
    const root = document.documentElement;
    const day = root.dataset.theme !== 'day';
    root.dataset.theme = day ? 'day' : 'night';
    get('theme').querySelector('span').textContent = day ? 'Tema nocturno' : 'Tema diurno';
    setMenu(false, true);
  });
  document.addEventListener('click', (event) => {
    if (!menu.hidden && !menu.contains(event.target) && !gear.contains(event.target)) setMenu(false);
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !menu.hidden) setMenu(false, true);
  });
  renderFavorites();
</script>
</body>
</html>

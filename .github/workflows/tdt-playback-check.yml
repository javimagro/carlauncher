name: Check packaged TDT playback

on:
  push:
    branches: [codex/tdt-runtime-build]
    paths:
      - .github/workflows/tdt-playback-check.yml

permissions:
  contents: read
  actions: read

jobs:
  playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the WebVTT build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 43108768025 --repo javimagro/carlauncher --interval 8 --exit-status
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43108768025
          name: tdt-runtime-linux-x64
          path: tdt-runtime-build
      - name: Decode public channels through the app's proxy and shared frame buffer
        run: |
          chmod +x tdt-runtime-build/ffmpeg
          node - <<'JS'
          const { createPlayer } = require('./native/javi-carlab/tdt-player');
          const startProxy = require('./native/javi-carlab/tdt-proxy');
          const { lookup } = require('dns');
          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const entries = [
            ['La 2', 'https://rtvelivestream.rtve.es/rtvesec/la2/la2_main_dvr.m3u8'],
            ['24h', 'https://ztnr.rtve.es/ztnr/1694255.m3u8'],
            ['Teledeporte', 'https://ztnr.rtve.es/ztnr/6712432.m3u8'],
            ['TV3', 'https://directes3-tv-cat.3catdirectes.cat/live-content/tv3-hls/master.m3u8']
          ];
          async function check([name, url]) {
            const directory = fs.mkdtempSync(path.join(os.tmpdir(), 'mgu-frame-'));
            const gpu = { video(id, file) { this.file = file; } };
            const player = createPlayer(gpu, {
              ffmpeg: path.resolve('tdt-runtime-build/ffmpeg'),
              caFile: path.resolve('tdt-runtime-build/ca-certificates.crt'),
              proxy: () => startProxy(lookup), directory
            });
            player.ready({ video: true });
            return new Promise((resolve) => {
              let finished = false;
              const finish = (result) => {
                if (finished) return;
                finished = true;
                clearTimeout(timer);
                player.stop();
                fs.rmdirSync(directory);
                console.log(name + ': ' + result);
                resolve(result === 'I420 OK');
              };
              const timer = setTimeout(() => finish('timed out'), 22000);
              player.start([url], (status) => {
                if (status === 'playing') {
                  const bytes = fs.readFileSync(gpu.file);
                  finish(bytes.readUInt32LE(0) === 0x4656474d && bytes.readUInt32LE(16) > 0 ? 'I420 OK' : 'invalid buffer');
                }
                if (status === 'error' || status === 'unavailable') finish(status);
              });
            });
          }
          Promise.all(entries.map(check)).then((results) => {
            if (!results.some(Boolean)) process.exitCode = 1;
          }, (err) => { console.error(err.code || err.message); process.exitCode = 1; });
          JS
